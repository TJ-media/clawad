<style>

  }
  :root[data-theme="dark"] { --bg: #14161d; --card: #1c1f29; --line: #2b2f3d; --text: #e8e6e1; --sub: #6f7482; }
  :root[data-theme="light"] { --bg: #faf6ef; --card: #ffffff; --line: #e5ddcf; --text: #3b3630; --sub: #8a8378; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; max-width: 1180px; margin: 0 auto; }
  .card { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 12px 6px; }
  .card svg { width: 100%; height: auto; display: block; }
  figcaption { text-align: center; font-size: 13px; color: var(--sub); padding: 6px 0 8px; font-variant-numeric: tabular-nums; }
  .defs { position: absolute; width: 0; height: 0; overflow: hidden; }
  svg image { image-rendering: pixelated; }

    @keyframes swayR { from { transform: rotate(-4deg); } to { transform: rotate(6deg); } }

      32% { transform: rotate(3deg); }
      42% { transform: rotate(-2.5deg); }

      62% { transform: rotate(-1.2deg); }
      72%, 100% { transform: rotate(0deg); }

    #st-react-poke .blink { animation: rpbEyes 2.2s ease-in-out infinite; }

    #st-react-poke .mouth { animation: rpbMouth 2.2s ease-in-out infinite; }
    @keyframes rpbMouth { 0%, 4% { transform: scale(1); } 10%, 72% { transform: scale(1.35); } 84%, 100% { transform: scale(1); } }
    #st-react-poke .arm-sm { animation: rpbArmL 0.3s ease-in-out infinite alternate; }
    @keyframes rpbArmL { from { transform: rotate(-20deg); } to { transform: rotate(4deg); } }
    #st-react-poke .arm-big { animation: rpbArmR 0.3s ease-in-out 0.15s infinite alternate backwards; }
    @keyframes rpbArmR { from { transform: rotate(-5deg); } to { transform: rotate(4deg); } }
    #st-react-poke .ant-l { animation: rpbAntL 0.4s ease-in-out infinite alternate; }
    #st-react-poke .ant-r { animation: rpbAntR 0.4s ease-in-out infinite alternate; }
    @keyframes rpbAntL { from { transform: rotate(-11deg); } to { transform: rotate(5deg); } }
    @keyframes rpbAntR { from { transform: rotate(-5deg); } to { transform: rotate(11deg); } }
    #st-react-poke .kk { opacity: 0; }
    #st-react-poke .kk1 { animation: rpbKk 2.2s ease-out infinite; }
    #st-react-poke .kk2 { animation: rpbKk 2.2s ease-out 0.5s infinite; }
    @keyframes rpbKk { 0%, 8% { opacity: 0; transform: translate(0, 0); } 16%, 55% { opacity: 1; } 75%, 100% { opacity: 0; transform: translate(18px, -55px); } }


    #st-react-double .pet { animation: rdbHop 0.65s ease-in-out infinite; }

    #st-react-double .claw-up { animation: rdbSnap 0.32s steps(2, jump-none) infinite; }

    #st-react-double .arm-big { animation: rdbWave 0.65s ease-in-out infinite alternate; }

    #st-react-double .arm-sm { animation: rdbArmL 0.65s ease-in-out infinite alternate; }

    #st-react-double .brow-l, #st-react-double .brow-r { animation: rdbBrow 0.65s ease-in-out infinite; }

    #st-react-double .heart { opacity: 0; }

    #st-dizzy .blink { opacity: 0; }
    #st-dizzy .dz-spin, #st-dizzy .dz-orbit { transform-box: fill-box; transform-origin: center; }
    #st-dizzy .dz-spin { animation: dzSpin 0.85s linear infinite; }
    #st-dizzy .dz-eye-r .dz-spin { animation-name: dzSpinBack; }
    @keyframes dzSpin { from { rotate: 0deg; } to { rotate: 360deg; } }
    @keyframes dzSpinBack { from { rotate: 0deg; } to { rotate: -360deg; } }
    #st-dizzy .dz-orbit { animation: dzOrbit 1.5s linear infinite; }

    #st-dizzy .lg { animation: dzLegs 0.31s steps(2, jump-none) infinite; }
    #st-dizzy .lg2 { animation-delay: 0.08s; }
    #st-dizzy .lg3 { animation-delay: 0.16s; }
    #st-dizzy .lg4 { animation-delay: 0.24s; }
    @keyframes dzLegs { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
    #st-dizzy .ant-l { animation: dzAntL 0.62s ease-in-out infinite alternate; }
    #st-dizzy .ant-r { animation: dzAntR 0.62s ease-in-out infinite alternate; }

    #st-dizzy .arm-big { animation: dzArmBig 0.62s ease-in-out infinite alternate; }
    @keyframes dzArmBig { from { transform: rotate(-6deg); } to { transform: rotate(2deg); } }
    #st-dizzy .arm-sm { animation: dzArmSm 0.62s ease-in-out 0.31s infinite alternate backwards; }

    #st-dizzy .mouth { animation: dzMouth 0.62s ease-in-out infinite alternate; }
    @keyframes dzMouth { from { transform: translateY(2px) scale(0.9, 1.1); } to { transform: translateY(4px) scale(1.05, 0.92); } }
