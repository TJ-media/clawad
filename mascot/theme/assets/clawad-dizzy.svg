<svg xmlns="http://www.w3.org/2000/svg" viewBox="-96 0 816 760">
  <style>
    image { image-rendering: pixelated; }
    .face { transform: scale(0.75); transform-origin: 239px 365px; }
    .ant-l { transform-origin: 175px 341px; }
    .ant-r { transform-origin: 233px 338px; }
    .arm-big { transform-origin: 330px 500px; }
    .claw-up { transform-origin: 388px 372px; }
    .arm-sm { transform-origin: 188px 545px; }
    .blink { transform-origin: 222px 390px; }
    .mouth { transform-origin: 222px 437px; }
    .brow-l { transform-origin: 154px 296px; }
    .brow-r { transform-origin: 291px 296px; }
    .pet { transform-origin: 222px 700px; }
    .tail { transform-origin: 190px 560px; }

    .pet { animation: dzWobble 0.62s ease-in-out infinite alternate; }
    @keyframes dzWobble { from { transform: rotate(-3deg) translateX(-4px); } to { transform: rotate(3deg) translateX(4px); } }
    .blink { opacity: 0; }
    .dz-spin, .dz-orbit { transform-box: fill-box; transform-origin: center; }
    .dz-spin { animation: dzSpin 0.85s linear infinite; }
    .dz-eye-r .dz-spin { animation-name: dzSpinBack; }
    @keyframes dzSpin { from { rotate: 0deg; } to { rotate: 360deg; } }
    @keyframes dzSpinBack { from { rotate: 0deg; } to { rotate: -360deg; } }
    .dz-orbit { animation: dzOrbit 1.5s linear infinite; }
    @keyframes dzOrbit { from { rotate: 0deg; } to { rotate: 360deg; } }
    .lg { animation: dzLegs 0.31s steps(2, jump-none) infinite; }
    .lg2 { animation-delay: 0.08s; }
    .lg3 { animation-delay: 0.16s; }
    .lg4 { animation-delay: 0.24s; }
    @keyframes dzLegs { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
    .ant-l { animation: dzAntL 0.62s ease-in-out infinite alternate; }
    .ant-r { animation: dzAntR 0.62s ease-in-out infinite alternate; }
    @keyframes dzAntL { from { transform: rotate(-30deg); } to { transform: rotate(-22deg); } }
    @keyframes dzAntR { from { transform: rotate(22deg); } to { transform: rotate(30deg); } }
    .tail { animation: dzTail 0.62s ease-in-out infinite alternate; }
    @keyframes dzTail { from { transform: rotate(-9deg); } to { transform: rotate(9deg); } }
    .arm-big { animation: dzArmBig 0.62s ease-in-out infinite alternate; }
    @keyframes dzArmBig { from { transform: rotate(-6deg); } to { transform: rotate(2deg); } }
    .arm-sm { animation: dzArmSm 0.62s ease-in-out 0.31s infinite alternate backwards; }
    @keyframes dzArmSm { from { transform: rotate(6deg); } to { transform: rotate(-8deg); } }
    .brow-l { transform: translateY(-8px) rotate(9deg); }
    .brow-r { transform: translateY(-8px) rotate(-9deg); }
    .mouth { animation: dzMouth 0.62s ease-in-out infinite alternate; }
    @keyframes dzMouth { from { transform: translateY(2px) scale(0.9, 1.1); } to { transform: translateY(4px) scale(1.05, 0.92); } }

  </style>

  <rect x="60" y="698" width="420" height="12" fill="#1e2235" opacity="0.16"/><rect x="80" y="710" width="380" height="6" fill="#1e2235" opacity="0.09"/>
  <g class="pet">
  <g class="ant-l"><image href="p-antenna-left.png" x="69" y="122" width="112" height="228"/></g>
  <g class="ant-r"><image href="p-antenna-right.png" x="164" y="115" width="81" height="232"/></g>
  <g class="arm-big">
    <g style="transform:rotate(10deg);transform-origin:343px 421px"><image href="p-arm-left.png" x="275" y="323" width="137" height="197"/></g>
    <image href="p-claw-2.png" x="385" y="57" width="221" height="334"/>
    <g class="claw-up"><image href="p-claw-1.png" x="280" y="87" width="159" height="295"/></g>
  </g>
  <image href="p-tail-side.png" x="-45" y="470" width="250" height="200" class="tail"/>
  <g class="lg lg1"><image href="p-leg-1.png" x="90" y="550" width="60" height="102"/></g>
  <g class="lg lg2"><image href="p-leg-2.png" x="145" y="558" width="52" height="103"/></g>
  <g class="lg lg3"><image href="p-leg-3.png" x="205" y="558" width="52" height="103"/></g>
  <g class="lg lg4"><image href="p-leg-4.png" x="260" y="550" width="58" height="101"/></g>
  <image href="p-body-face.png" x="123" y="264" width="199" height="338"/>
  <g class="arm-sm"><image href="p-arm-right.png" x="73" y="405" width="123" height="177"/></g>
  
  <g class="face">
    <g class="brow-l"><image href="p-brow-l.png" x="133" y="283" width="42" height="26"/></g>
    <g class="brow-r"><image href="p-brow-r.png" x="271" y="283" width="41" height="26"/></g>
    <g class="blink"><image href="p-eye-l.png" x="130" y="326" width="45" height="72"/><image href="p-eye-r.png" x="270" y="326" width="43" height="72"/></g>
    <g class="dz-eye dz-eye-l" transform="translate(152 362)"><circle cx="0" cy="0" r="25" fill="#fdefea"/><g class="dz-spin"><path d="M 20.0 0 A 15.8 15.8 0 0 1 -11.6 0 A 8.6 8.6 0 0 1 5.6 0 A 3.5 3.5 0 0 1 -1.4 0" fill="none" stroke="#5a6084" stroke-width="5" stroke-linecap="round"/></g></g><g class="dz-eye dz-eye-r" transform="translate(291 362)"><circle cx="0" cy="0" r="25" fill="#fdefea"/><g class="dz-spin"><path d="M 20.0 0 A 15.8 15.8 0 0 1 -11.6 0 A 8.6 8.6 0 0 1 5.6 0 A 3.5 3.5 0 0 1 -1.4 0" fill="none" stroke="#5a6084" stroke-width="5" stroke-linecap="round"/></g></g>
    <image href="p-cheek-left.png" x="117" y="400" width="66" height="36"/><image href="p-cheek-right.png" x="262" y="395" width="64" height="36"/><g class="mouth"><image href="p-mouth.png" x="183" y="408" width="79" height="57"/></g>
  </g>
  
  <g class="dz-halo" transform="translate(222 155)"><g class="dz-orbit"><circle cx="0" cy="0" r="134" fill="none"/><path d="M -96.5 -17.0 A 98 98 0 0 1 -0.0 -98.0" fill="none" stroke="#ffd23e" stroke-width="13" stroke-linecap="round" opacity="0.9"/><path d="M -0.0 -98.0 A 98 98 0 0 1 96.5 -17.0" fill="none" stroke="#ff8a5c" stroke-width="13" stroke-linecap="round" opacity="0.9"/><g transform="translate(-84.9 -49.0)"><path d="M 0 -23 L 6.4 -6.4 L 23 0 L 6.4 6.4 L 0 23 L -6.4 6.4 L -23 0 L -6.4 -6.4 Z" fill="#ffffff" transform="scale(1.32)"/><path d="M 0 -23 L 6.4 -6.4 L 23 0 L 6.4 6.4 L 0 23 L -6.4 6.4 L -23 0 L -6.4 -6.4 Z" fill="#ffd23e"/></g><g transform="translate(-0.0 -98.0)"><path d="M 0 -26 L 7.3 -7.3 L 26 0 L 7.3 7.3 L 0 26 L -7.3 7.3 L -26 0 L -7.3 -7.3 Z" fill="#ffffff" transform="scale(1.32)"/><path d="M 0 -26 L 7.3 -7.3 L 26 0 L 7.3 7.3 L 0 26 L -7.3 7.3 L -26 0 L -7.3 -7.3 Z" fill="#ffab4a"/></g><g transform="translate(84.9 -49.0)"><path d="M 0 -21 L 5.9 -5.9 L 21 0 L 5.9 5.9 L 0 21 L -5.9 5.9 L -21 0 L -5.9 -5.9 Z" fill="#ffffff" transform="scale(1.32)"/><path d="M 0 -21 L 5.9 -5.9 L 21 0 L 5.9 5.9 L 0 21 L -5.9 5.9 L -21 0 L -5.9 -5.9 Z" fill="#ff8a5c"/></g></g></g>
  </g>
</svg>
