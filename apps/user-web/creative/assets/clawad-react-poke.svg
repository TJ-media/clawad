<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 0 780 760">
  <style>
    image { image-rendering: pixelated; }
    .face { transform: scale(0.75); transform-origin: 239px 365px; }
    .ant-l { transform-origin: 175px 341px; }
    .ant-r { transform-origin: 233px 338px; }
    .arm-big { transform-origin: 330px 500px; }
    .claw-up { transform-origin: 388px 372px; }
    .arm-sm { transform-origin: 188px 545px; }
    .blink { transform-origin: 222px 390px; }
    .mouth { transform-origin: 222px 437px; }
    .brow-l { transform-origin: 154px 296px; }
    .brow-r { transform-origin: 291px 296px; }
    .pet { transform-origin: 222px 700px; }
    .tail { transform-origin: 190px 560px; }

    .pet { animation: rpbWiggle 2.2s ease-in-out infinite; }
    @keyframes rpbWiggle {
      0%, 4% { transform: rotate(0deg); }
      12% { transform: rotate(3.5deg); }
      22% { transform: rotate(-3.5deg); }
      32% { transform: rotate(3deg); }
      42% { transform: rotate(-2.5deg); }
      52% { transform: rotate(2deg); }
      62% { transform: rotate(-1.2deg); }
      72%, 100% { transform: rotate(0deg); }
    }
    .blink { animation: rpbEyes 2.2s ease-in-out infinite; }
    @keyframes rpbEyes { 0%, 4% { transform: scaleY(1); } 10%, 72% { transform: scaleY(0.22); } 84%, 100% { transform: scaleY(1); } }
    .mouth { animation: rpbMouth 2.2s ease-in-out infinite; }
    @keyframes rpbMouth { 0%, 4% { transform: scale(1); } 10%, 72% { transform: scale(1.35); } 84%, 100% { transform: scale(1); } }
    .arm-sm { animation: rpbArmL 0.3s ease-in-out infinite alternate; }
    @keyframes rpbArmL { from { transform: rotate(-20deg); } to { transform: rotate(4deg); } }
    .arm-big { animation: rpbArmR 0.3s ease-in-out 0.15s infinite alternate backwards; }
    @keyframes rpbArmR { from { transform: rotate(-5deg); } to { transform: rotate(4deg); } }
    .ant-l { animation: rpbAntL 0.4s ease-in-out infinite alternate; }
    .ant-r { animation: rpbAntR 0.4s ease-in-out infinite alternate; }
    @keyframes rpbAntL { from { transform: rotate(-11deg); } to { transform: rotate(5deg); } }
    @keyframes rpbAntR { from { transform: rotate(-5deg); } to { transform: rotate(11deg); } }
    .kk { opacity: 0; }
    .kk1 { animation: rpbKk 2.2s ease-out infinite; }
    .kk2 { animation: rpbKk 2.2s ease-out 0.5s infinite; }
    @keyframes rpbKk { 0%, 8% { opacity: 0; transform: translate(0, 0); } 16%, 55% { opacity: 1; } 75%, 100% { opacity: 0; transform: translate(18px, -55px); } }

  </style>

  <rect x="60" y="698" width="420" height="12" fill="#1e2235" opacity="0.16"/><rect x="80" y="710" width="380" height="6" fill="#1e2235" opacity="0.09"/>
  <g class="pet">
  <g class="ant-l"><image href="p-antenna-left.png" x="69" y="122" width="112" height="228"/></g>
  <g class="ant-r"><image href="p-antenna-right.png" x="164" y="115" width="81" height="232"/></g>
  <g class="arm-big">
    <g style="transform:rotate(10deg);transform-origin:343px 421px"><image href="p-arm-left.png" x="275" y="323" width="137" height="197"/></g>
    <image href="p-claw-2.png" x="385" y="57" width="221" height="334"/>
    <g class="claw-up"><image href="p-claw-1.png" x="280" y="87" width="159" height="295"/></g>
  </g>
  <image href="p-tail-side.png" x="-45" y="470" width="250" height="200" class="tail"/>
  <g class="lg lg1"><image href="p-leg-1.png" x="90" y="550" width="60" height="102"/></g>
  <g class="lg lg2"><image href="p-leg-2.png" x="145" y="558" width="52" height="103"/></g>
  <g class="lg lg3"><image href="p-leg-3.png" x="205" y="558" width="52" height="103"/></g>
  <g class="lg lg4"><image href="p-leg-4.png" x="260" y="550" width="58" height="101"/></g>
  <image href="p-body-face.png" x="123" y="264" width="199" height="338"/>
  <g class="arm-sm"><image href="p-arm-right.png" x="73" y="405" width="123" height="177"/></g>
  
  <g class="face">
    <g class="brow-l"><image href="p-brow-l.png" x="133" y="283" width="42" height="26"/></g>
    <g class="brow-r"><image href="p-brow-r.png" x="271" y="283" width="41" height="26"/></g>
    <g class="blink"><image href="p-eye-l.png" x="130" y="326" width="45" height="72"/><image href="p-eye-r.png" x="270" y="326" width="43" height="72"/></g>
    <image href="p-cheek-left.png" x="117" y="400" width="66" height="36"/><image href="p-cheek-right.png" x="262" y="395" width="64" height="36"/><g class="mouth"><image href="p-mouth.png" x="183" y="408" width="79" height="57"/></g>
  </g>
  
  
    <g class="kk kk1">
      <g fill="#ffffff"><rect x="352" y="185" width="50" height="20"/><rect x="352" y="207" width="50" height="20"/><rect x="380" y="181" width="20" height="60"/></g>
      <g fill="#1e2235"><rect x="356" y="189" width="40" height="10"/><rect x="356" y="211" width="40" height="10"/><rect x="384" y="185" width="10" height="50"/></g>
    </g>
    <g class="kk kk2">
      <g fill="#ffffff"><rect x="416" y="145" width="42" height="18"/><rect x="416" y="164" width="42" height="18"/><rect x="440" y="141" width="18" height="52"/></g>
      <g fill="#1e2235"><rect x="420" y="149" width="32" height="8"/><rect x="420" y="168" width="32" height="8"/><rect x="444" y="145" width="8" height="44"/></g>
    </g>
  </g>
</svg>
