global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    service: clawad
    environment: alpha

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: clawad-api
    metrics_path: /monitor/v1/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/monitoring_token
    static_configs:
      - targets: ['api:3000']

  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']

  # 호스트 메모리·swap·디스크·CPU·OOM (CLAW-76)
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  # 컨테이너별 메모리·CPU·재시작·OOM 이벤트 (CLAW-76)
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  # 알림 경로 자기감시 (CLAW-179). 이 둘을 스크레이프하지 않으면 알림 전달이 끊겨도
  # 아무도 모른다 — 경보를 못 보내는 상태 자체가 무증상이기 때문이다.
  # alertmanager_notifications_failed_total은 alertmanager가 기본 /metrics로 노출한다.
  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: alert-bridge
    static_configs:
      - targets: ['alert-bridge:9099']
